<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — ICIE Canada</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5a96'/%3E%3Cpath d='M6 21 L12 15 L17 19 L26 8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f3ee;
      --surface: #ffffff;
      --ink: #20252b;
      --muted: #66707d;
      --line: #d8d4cc;
      --blue: #1f5a96;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Candara, Aptos, Segoe UI, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    .box {
      max-width: 480px;
      text-align: center;
      padding: 32px 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1;
      font-family: Georgia, Cambria, serif;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
    }
    a {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 18px;
      background: var(--surface);
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.15s ease;
    }
    a:hover { background: #ece7dd; }
    a:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Page introuvable</h1>
    <p>Cette page n'existe pas ou a été déplacée. Le tableau de bord ICIE Canada reste disponible à l'adresse principale.</p>
    <a href="/icie-dashboard/">Retour au tableau de bord</a>
  </div>
</body>
</html>
